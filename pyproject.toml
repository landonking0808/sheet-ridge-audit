[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-ridge-audit"
version = "0.3.0"
description = "Audit Vesuvius Challenge tifxyz segments for leaving the papyrus sheet and sheet switches, by sampling CT or prediction fields along the surface normal."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Landon W. King"}]
requires-python = ">=3.9"
keywords = ["vesuvius-challenge", "herculaneum", "tifxyz", "ome-zarr", "segmentation", "quality-control"]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "tifffile",
  "imagecodecs",
  "numcodecs",
  "fsspec",
  "aiohttp",
  "requests",
  "matplotlib",
]

[project.urls]
Homepage = "https://github.com/landonking0808/sheet-ridge-audit"
Issues = "https://github.com/landonking0808/sheet-ridge-audit/issues"

[project.optional-dependencies]
test = ["pytest", "zarr>=2.11,<3"]

[project.scripts]
sheet-ridge-audit = "sheet_ridge_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
